name: Build launcher and downloader

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install launcher packages
        run: npm ci

      - name: Build Windows launcher installer
        run: npx --yes electron-builder@26.18.0 --win nsis --x64 --publish always

      - name: Build standalone downloader
        shell: pwsh
        run: .\Downloader\build.ps1

      - name: Create installer checksum
        shell: pwsh
        run: |
          $file = 'dist/Artificiai-Launcher-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Artificiai-Launcher-Setup.exe" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
          if (-not (Test-Path -LiteralPath 'dist/latest.yml')) { throw 'electron-builder did not create dist/latest.yml; auto-update metadata is required.' }
          if (-not (Test-Path -LiteralPath 'dist/Artificiai-Launcher-Setup.exe.blockmap')) { throw 'electron-builder did not create the Windows update blockmap.' }

      - name: Attach installer and updater metadata to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $assets = @(
            'dist/Artificiai-Launcher-Setup.exe',
            'dist/Artificiai-Launcher-Setup.exe.blockmap',
            'dist/latest.yml',
            'dist/SHA256SUMS.txt',
            'Downloader/Artificiai-Downloader.exe'
          )
          gh release upload "$env:GITHUB_REF_NAME" @assets --clobber --repo "$env:GITHUB_REPOSITORY"
